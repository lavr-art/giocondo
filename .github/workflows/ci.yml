name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to the same branch or PR cancels the stale run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tests and lint are separate jobs so a PR reports both results even when one of them fails.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - name: web stylesheet is current
        run: |
          make css
          git diff --exit-code internal/transport/http/web/static/app.css
      - name: installer regressions
        run: |
          sh -n install.sh
          for script in deploy/apt/deb/*.sh deploy/apt/recover.sh deploy/rules/build.sh; do sh -n "$script"; done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
