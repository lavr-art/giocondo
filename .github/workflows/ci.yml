name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...
      - name: installer regressions
        run: |
          sh -n install.sh
          for script in deploy/apt/deb/*.sh deploy/apt/recover.sh; do sh -n "$script"; done
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
