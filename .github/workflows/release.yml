# Release on a v* tag: GoReleaser builds the debs (giocondo-vpn-panel, giocondo-vpn-agent, giocondo-vpn-sing-box; amd64, arm64) and
# a GitHub Release, then the packages are added to the apt repository on the gh-pages branch (GitHub Pages).
# The APT_GPG_PRIVATE_KEY secret is the signing private key without a passphrase (docs/release.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  candidate:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: sing-box version
        run: echo "SINGBOX_VERSION=$(cd build/sing-box && go list -m -f '{{.Version}}' github.com/sagernet/sing-box | sed 's/^v//')" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.19.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: |
            dist/*.deb
            dist/giocondo-vpn-agent_*
            dist/SHA256SUMS

  packages:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: dist
      - name: Clean install and unchanged repeat
        run: sh test/network-e2e/run.sh installer
      - name: Previous stable, installer upgrade and recovery
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_PATH: installer
        run: sh test/network-e2e/run.sh upgrade
      - name: Previous stable, direct APT upgrade and recovery
        env:
          GH_TOKEN: ${{ github.token }}
          UPGRADE_PATH: apt
        run: sh test/network-e2e/run.sh upgrade
      - name: Real server and client configuration validators
        run: sh test/client-validators.sh
      - name: Diagnostic logs
        if: failure()
        run: sh test/network-e2e/run.sh logs
      - name: Tear down isolated containers
        if: always()
        run: sh test/network-e2e/run.sh down

  publish:
    needs: [checks, candidate, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: dist
      - name: Publish the tested artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --draft ./*.deb ./giocondo-vpn-agent_*_linux_* ./SHA256SUMS

  apt:
    needs: publish
    runs-on: ubuntu-latest
    concurrency: gh-pages
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: debs
      - name: checkout gh-pages
        run: |
          if git fetch origin gh-pages; then
            git worktree add site origin/gh-pages && git -C site switch -C gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
      - name: import signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')" >> "$GITHUB_ENV"
      - run: sudo apt-get install -y --no-install-recommends apt-utils
      - run: deploy/apt/update-repo.sh site "$KEY_ID" debs/*.deb
      - run: cp install.sh site/install.sh
      - name: publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apt: ${GITHUB_REF_NAME}"
          git push origin gh-pages

      - name: Mark the verified release public
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
