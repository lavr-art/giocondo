# Release: vpnctl-panel, vpnctl-agent and vpnctl-sing-box deb packages for linux amd64/arm64.
# Locally: make deb (snapshot in dist/). In CI: .github/workflows/release.yml on a v* tag.
# SINGBOX_VERSION (without "v") comes from the environment: make deb / the workflow take it from build/sing-box/go.mod.
version: 2
project_name: vpnctl

builds:
  - id: panel
    main: ./cmd/panel
    binary: vpnctl-panel
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

  - id: agent
    main: ./cmd/agent
    binary: vpnctl-agent
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

  # Our own sing-box build: the same tags and ldflags as in the Makefile (sing-box target).
  - id: sing-box
    dir: build/sing-box
    main: github.com/sagernet/sing-box/cmd/sing-box
    no_main_check: true
    binary: sing-box
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    tags: [with_gvisor, with_quic, with_dhcp, with_wireguard, with_utls, with_acme, with_clash_api,
           with_tailscale, with_ccm, with_ocm, with_cloudflared, with_usbip, with_openvpn, with_openconnect,
           badlinkname, tfogo_checklinkname0, with_v2ray_api]
    ldflags:
      - "-X 'github.com/sagernet/sing-box/constant.Version={{ .Env.SINGBOX_VERSION }}'"
      - "-X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid="

archives:
  - id: agent
    ids: [agent]
    formats: [binary]
    name_template: "vpnctl-agent_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: vpnctl-sing-box
    package_name: vpnctl-sing-box
    ids: [sing-box]
    formats: [deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: vpnctl
    section: net
    homepage: https://github.com/artemlavr/giocondo
    maintainer: artemlavr <artemlavr@users.noreply.github.com>
    license: GPL-3.0-or-later
    description: |-
      sing-box {{ .Env.SINGBOX_VERSION }} built with with_v2ray_api for vpnctl nodes.
      Managed by vpnctl-agent; does not conflict with the official sing-box package.
    bindir: /usr/lib/vpnctl
    contents:
      - src: deploy/apt/systemd/vpnctl-sing-box.service
        dst: /usr/lib/systemd/system/vpnctl-sing-box.service
    scripts:
      postinstall: deploy/apt/deb/sing-box-postinst.sh
      preremove: deploy/apt/deb/sing-box-prerm.sh
      postremove: deploy/apt/deb/sing-box-postrm.sh

  - id: vpnctl-agent
    package_name: vpnctl-agent
    ids: [agent]
    formats: [deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: vpnctl
    section: net
    homepage: https://github.com/artemlavr/giocondo
    maintainer: artemlavr <artemlavr@users.noreply.github.com>
    license: GPL-3.0-or-later
    description: |-
      vpnctl node agent: connects to the vpnctl panel over gRPC/mTLS,
      applies sing-box config and reports per-user traffic.
    bindir: /usr/bin
    dependencies: [vpnctl-sing-box, iptables]
    contents:
      - src: deploy/apt/systemd/vpnctl-agent.service
        dst: /usr/lib/systemd/system/vpnctl-agent.service
      - src: deploy/apt/deb/agent.env
        dst: /usr/share/vpnctl/agent.env.example
    scripts:
      postinstall: deploy/apt/deb/agent-postinst.sh
      preremove: deploy/apt/deb/agent-prerm.sh
      postremove: deploy/apt/deb/agent-postrm.sh

  - id: vpnctl-panel
    package_name: vpnctl-panel
    ids: [panel]
    formats: [deb]
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: vpnctl
    section: net
    homepage: https://github.com/artemlavr/giocondo
    maintainer: artemlavr <artemlavr@users.noreply.github.com>
    license: GPL-3.0-or-later
    description: |-
      vpnctl panel: users, nodes, subscriptions, REST API and web interface.
      Install vpnctl-agent too to use this machine as a node (vpnctl-panel local-node).
    bindir: /usr/bin
    dependencies: [passwd]
    recommends: [vpnctl-agent]
    contents:
      - src: deploy/apt/systemd/vpnctl-panel.service
        dst: /usr/lib/systemd/system/vpnctl-panel.service
      - src: deploy/apt/deb/panel.env
        dst: /usr/share/vpnctl/panel.env.example
    scripts:
      postinstall: deploy/apt/deb/panel-postinst.sh
      preremove: deploy/apt/deb/panel-prerm.sh
      postremove: deploy/apt/deb/panel-postrm.sh

checksum:
  name_template: SHA256SUMS

snapshot:
  version_template: '{{ incpatch .Version }}~dev{{ .Now.Format "20060102150405" }}'

changelog:
  use: github
  filters:
    exclude: ["^docs:", "^test:"]

release:
  draft: false
