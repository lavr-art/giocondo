# Example node for genconf. Keys, short_id, certificate, UUIDs and WG addresses
# are added by `genconf fill -in node.yaml` (the file is rewritten and comments are lost).
node:
  id: n1
  host: n1.example.com
  inbounds:
    - type: vless-reality
      tag: vless
      port: 443
      reality:
        dest: www.microsoft.com:443
        server_name: www.microsoft.com
    - type: hysteria2
      tag: hy2
      port: 8443
      hysteria2:
        tls: self-signed   # or acme: needs a domain in host and a free 80/tcp for http-01
    - type: wireguard
      tag: wg
      port: 51820
      wireguard:
        subnet: 10.70.0.0/24
users:
  - name: artem
  - name: test1
