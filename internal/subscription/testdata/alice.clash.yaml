    type: vless
    server: n1.example.com
    port: 443
    udp: true
    uuid: 4102d004-05cf-4c09-a720-09fc68193cae
    network: tcp
    tls: true
    flow: xtls-rprx-vision
    servername: www.microsoft.com
    client-fingerprint: chrome
    reality-opts:
      public-key: BlLfoNFcwbORwol0o9Xs21JjVvY8jUkNiiwDrqAOPkc
      short-id: 1fd1620d
  - name: n1 · Hysteria2
    type: hysteria2
    server: n1.example.com
    port: 8443
    udp: true
    password: 4102d004-05cf-4c09-a720-09fc68193cae
    sni: n1.example.com
    skip-cert-verify: true
    fingerprint: d2ddeabc30a3f3b545b4401616f97b67489bb2b582c63f7c211735e22cb5004e
    alpn:
      - h3
    obfs: salamander
    obfs-password: obfs-secret
  - name: n1 · WireGuard
    type: wireguard
    server: n1.example.com
    port: 51820
    udp: true
    ip: 10.70.0.2
    private-key: jnWjTuDySepBSvZikdpMeXC4Ql8AexWlaNVQ+BaYPZw=
    public-key: Fs/OIg83CS7Ilwdj4hdibmubwWnrqb0kv1r1BViKlwU=
    pre-shared-key: 7z44XzUXyG8NIlGVca7CMvNwi/oidoiexCCkscWv9aI=
    allowed-ips:
      - 0.0.0.0/0
      - ::/0
    mtu: 1408
  - name: n2 · Reality
    type: vless
    server: n2.example.com
    port: 443
    udp: true
    uuid: 4102d004-05cf-4c09-a720-09fc68193cae
    network: tcp
    tls: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
