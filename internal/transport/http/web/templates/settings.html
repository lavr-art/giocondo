{{define "content"}}
<h1>Settings</h1>
<h2>Subscriptions</h2>
<div class="card">
  <form method="post" action="{{base}}/settings">
    <p><label>Profile name<br>
      <input type="text" name="title" value="{{.Data.Title}}" required maxlength="128"></label></p>
    <p class="muted">The profile name clients show. Overrides PANEL_SUB_TITLE.</p>
    <p><label>Update interval, hours<br>
      <input class="narrow" type="number" name="update_interval_hours" value="{{.Data.UpdateIntervalHours}}" required min="1" max="168"></label></p>
    <p class="muted">How often clients should refresh the subscription.</p>
    <p><button class="primary">Save</button></p>
  </form>
</div>
{{end}}
