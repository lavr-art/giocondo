// Minimal copy of StatsService from sing-box v2ray_api (experimental/v2rayapi/stats.proto).
// The package matches the one sing-box registers the service under, so the agent reads
// statistics without pulling in the sing-box module. Field numbers must not change.
syntax = "proto3";

package v2ray.core.app.stats.command;
option go_package = "github.com/artemlavr/giocondo/internal/nodeapi/v2raystats";

message Stat {
  string name = 1;
  int64 value = 2;
}

message QueryStatsRequest {
  string pattern = 1; // deprecated in sing-box, we use patterns
  bool reset = 2;
  repeated string patterns = 3;
  bool regexp = 4;
}

message QueryStatsResponse {
  repeated Stat stat = 1;
}

service StatsService {
  rpc QueryStats(QueryStatsRequest) returns (QueryStatsResponse) {}
}
